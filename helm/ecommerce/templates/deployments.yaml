{{- range $name, $svc := .Values.services }}
{{- $app := printf "%s-service" $name }}
{{- $db := printf "%s-db" $name }}
{{- $autoscaling := default $.Values.defaults.autoscaling $svc.autoscaling }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $app }}
    {{- include "ecommerce.labels" $ | nindent 4 }}
spec:
  {{- if not $autoscaling.enabled }}
  replicas: {{ default $.Values.defaults.replicas $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $app }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: {{ $app }}
        tier: backend
      annotations:
        # Restart pods when settings change on helm upgrade
        checksum/config: {{ toYaml $svc.config | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-db
          image: {{ $.Values.database.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h {{ $db }} -p 5432 -U {{ $.Values.database.user }}; do echo waiting for {{ $db }}; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: {{ $app }}
          image: "{{ $.Values.image.repository }}/{{ $app }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce.secretName" $ }}
                  key: db-password
            {{- range $envName, $key := $svc.secretEnv }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml (default $.Values.defaults.resources $svc.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $app }}
    {{- include "ecommerce.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ $app }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- if $autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $app }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $app }}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
{{- end }}
{{- end }}
