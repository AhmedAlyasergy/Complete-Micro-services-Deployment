{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ required "secrets.dbPassword is required" .Values.secrets.dbPassword | quote }}
  jwt-secret: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  internal-api-key: {{ required "secrets.internalApiKey is required" .Values.secrets.internalApiKey | quote }}
  admin-password: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
{{- end }}
