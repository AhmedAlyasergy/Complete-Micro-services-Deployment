{{- range $name, $svc := .Values.services }}
{{- $db := printf "%s-db" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $db }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $db }}
    {{- include "ecommerce.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: {{ $db }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $db }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $db }}
    {{- include "ecommerce.labels" $ | nindent 4 }}
spec:
  serviceName: {{ $db }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ $db }}
  template:
    metadata:
      labels:
        app: {{ $db }}
        tier: database
    spec:
      containers:
        - name: postgres
          image: {{ $.Values.database.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $svc.dbName | quote }}
            - name: POSTGRES_USER
              value: {{ $.Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce.secretName" $ }}
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ $.Values.database.user }} -d {{ $svc.dbName }}"]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ $.Values.database.user }} -d {{ $svc.dbName }}"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $.Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $.Values.database.storage }}
{{- end }}
