
name: CI - Tests and Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            db_name: auth_db_test
          - service: products-service
            db_name: products_db_test
          - service: orders-service
            db_name: orders_db_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Create test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE auth_db_test;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE products_db_test;"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE orders_db_test;"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME_TEST: ${{ matrix.db_name }}
          JWT_SECRET: test-secret
          INTERNAL_API_KEY: test-internal-key
        run: npm test

  gitleaks:
    name: Gitleaks Secret Scan
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build and Push ${{ matrix.service }}
    needs: [test, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - products-service
          - orders-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ghcr.io/ahmedalyasergy/${{ matrix.service }}:${{ github.sha }}

  trivy-scan:
    name: Trivy Scan ${{ matrix.service }}
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - products-service
          - orders-service

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/ahmedalyasergy/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: os,library

  deploy:
    name: Deploy to Kubernetes
    needs: trivy-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create Kubernetes cluster with kind
        uses: helm/kind-action@v1.12.0

      - name: Validate Helm chart
        run: helm lint ./helm/ecommerce

      - name: Deploy application with Helm
        shell: bash
        run: |
          set -euo pipefail

          DB_PASSWORD="$(openssl rand -hex 32)"
          JWT_SECRET="$(openssl rand -hex 32)"
          INTERNAL_API_KEY="$(openssl rand -hex 32)"
          ADMIN_PASSWORD="$(openssl rand -hex 16)"

          helm upgrade --install ecommerce ./helm/ecommerce \
            --namespace ecommerce \
            --create-namespace \
            --set-string image.repository=ghcr.io/ahmedalyasergy \
            --set-string image.tag="${GITHUB_SHA}" \
            --set-string secrets.dbPassword="$DB_PASSWORD" \
            --set-string secrets.jwtSecret="$JWT_SECRET" \
            --set-string secrets.internalApiKey="$INTERNAL_API_KEY" \
            --set-string secrets.adminPassword="$ADMIN_PASSWORD" \
            --set ingress.enabled=false \
            --wait \
            --timeout 10m

      - name: Check Kubernetes deployments
        run: |
          kubectl get pods -n ecommerce
          kubectl get services -n ecommerce

          kubectl rollout status deployment/auth-service \
            -n ecommerce --timeout=180s

          kubectl rollout status deployment/products-service \
            -n ecommerce --timeout=180s

          kubectl rollout status deployment/orders-service \
            -n ecommerce --timeout=180s

      - name: Smoke test application health endpoints
        shell: bash
        run: |
          set -euo pipefail

          kubectl port-forward -n ecommerce svc/auth-service 3001:3001 >/tmp/auth.log 2>&1 &
          AUTH_PID=$!

          kubectl port-forward -n ecommerce svc/products-service 3002:3002 >/tmp/products.log 2>&1 &
          PRODUCTS_PID=$!

          kubectl port-forward -n ecommerce svc/orders-service 3003:3003 >/tmp/orders.log 2>&1 &
          ORDERS_PID=$!

          trap 'kill "$AUTH_PID" "$PRODUCTS_PID" "$ORDERS_PID" 2>/dev/null || true' EXIT

          echo "Checking Auth Service..."
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 3 \
            http://127.0.0.1:3001/health

          echo "Checking Products Service..."
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 3 \
            http://127.0.0.1:3002/health

          echo "Checking Orders Service..."
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 3 \
            http://127.0.0.1:3003/health

          echo "All services passed health checks!"