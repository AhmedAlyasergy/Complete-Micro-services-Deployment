# Runs the whole system locally: 3 services, 3 databases and the API gateway.
#
#   cd docker
#   cp .env.example .env        # then change the secrets
#   docker compose up --build
#
# Everything is reachable through the gateway at http://localhost:8080

name: ecommerce

x-db-defaults: &db-defaults
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

x-service-healthcheck: &service-healthcheck
  interval: 10s
  timeout: 3s
  start_period: 15s
  retries: 5

services:
  # ---------- Databases (one per service) ----------
  auth-db:
    <<: *db-defaults
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  products-db:
    <<: *db-defaults
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
    volumes:
      - products-db-data:/var/lib/postgresql/data

  orders-db:
    <<: *db-defaults
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
    volumes:
      - orders-db-data:/var/lib/postgresql/data

  # ---------- Microservices ----------
  auth-service:
    build: ../services/auth-service
    image: ecommerce/auth-service:local
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in docker/.env}
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/ready"]
      <<: *service-healthcheck

  products-service:
    build: ../services/products-service
    image: ecommerce/products-service:local
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: products-db
      DB_PORT: 5432
      DB_NAME: products_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in docker/.env}
    depends_on:
      products-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/ready"]
      <<: *service-healthcheck

  orders-service:
    build: ../services/orders-service
    image: ecommerce/orders-service:local
    restart: unless-stopped
    environment:
      PORT: 3003
      DB_HOST: orders-db
      DB_PORT: 5432
      DB_NAME: orders_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PRODUCTS_URL: http://products-service:3002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PRODUCTS_TIMEOUT_MS: 3000
    depends_on:
      orders-db:
        condition: service_healthy
      products-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/ready"]
      <<: *service-healthcheck

  # ---------- API Gateway (single entry point) ----------
  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ../api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      products-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy

volumes:
  auth-db-data:
  products-db-data:
  orders-db-data:
