# API Gateway for Docker Compose.
# One address (http://localhost:8080) in front of the three services.
# In Kubernetes the Ingress does this same routing.

upstream auth     { server auth-service:3001; }
upstream products { server products-service:3002; }
upstream orders   { server orders-service:3003; }

server {
    listen 80;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;

    location /api/auth      { proxy_pass http://auth; }
    location /api/products  { proxy_pass http://products; }
    location /api/orders    { proxy_pass http://orders; }

    # Gateway's own health check
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":"Not found"}';
    }
}
