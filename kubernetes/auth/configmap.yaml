# Non-secret settings for auth-service. Secrets come from ecommerce-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: ecommerce
  labels:
    app: auth-service
data:
  PORT: "3001"
  DB_HOST: "auth-db"
  DB_PORT: "5432"
  DB_NAME: "auth_db"
  DB_USER: "postgres"
  JWT_EXPIRES_IN: "1h"
  ADMIN_EMAIL: "admin@shop.com"
