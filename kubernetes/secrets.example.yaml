# Copy to secrets.yaml (git-ignored) and change every value:
#   copy kubernetes\secrets.example.yaml kubernetes\secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  db-password: "change-me-db-password"
  jwt-secret: "change-me-jwt-secret"          # shared by all 3 services
  internal-api-key: "change-me-internal-key"  # shared by products and orders
  admin-password: "change-me-admin-password"
