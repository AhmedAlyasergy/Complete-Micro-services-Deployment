# Non-secret settings for products-service. Secrets come from ecommerce-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: products-config
  namespace: ecommerce
  labels:
    app: products-service
data:
  PORT: "3002"
  DB_HOST: "products-db"
  DB_PORT: "5432"
  DB_NAME: "products_db"
  DB_USER: "postgres"
